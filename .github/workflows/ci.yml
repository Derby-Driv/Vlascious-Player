
# =============================================================================
# Krona Player — CI Pipeline
# =============================================================================
# Builds and tests the project inside an emulated ARM64 Docker container.
# Produces a downloadable ARM64 executable for the R36S.
# =============================================================================

name: CI — ARM64 Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up QEMU for ARM64 emulation
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # 3. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build ARM64 development image
      - name: Build ARM64 dev image
        run: |
          docker build --platform linux/arm64 -t r36s-dev-env .

      # 5. Compile the project in Release mode
      - name: Build project
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/project \
            -w /project \
            r36s-dev-env \
            bash -c "
              mkdir -p build &&
              cd build &&
              cmake .. -DCMAKE_BUILD_TYPE=Release &&
              make -j\$(nproc)
            "

      # 6. Verify the ARM64 executable exists
      - name: Verify executable
        run: |
          test -x build/krona_player
          file build/krona_player
          ls -lh build/krona_player

      # 7. Run unit tests
      - name: Run tests
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/project \
            -w /project \
            r36s-dev-env \
            bash -c "
              cd build &&
              ctest --output-on-failure
            "

      # 8. Upload downloadable R36S executable
      - name: Upload patched R36S player
        uses: actions/upload-artifact@v4
        with:
          name: krona-player-aspect-fit
          path: build/krona_player
          if-no-files-found: error
          retention-days: 7
